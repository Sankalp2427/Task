<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#4f46e5a">
<title>My Tasks</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5fa;--card:#fff;--text:#1c1c28;--muted:#6b6b80;--accent:#4f46e5;--accent-text:#fff;--line:#e4e4ee;--danger:#dc2626;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111118;--card:#1c1c28;--text:#f2f2f8;--muted:#9a9ab0;--accent:#818cf8;--accent-text:#111118;--line:#2e2e40;--danger:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111118;--card:#1c1c28;--text:#f2f2f8;--muted:#9a9ab0;--accent:#818cf8;--accent-text:#111118;--line:#2e2e40;--danger:#f87171;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{padding:14px 20px 8px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
.om{text-align:center;font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.5px;margin:0 0 8px}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
#banner{display:none;margin:6px 16px;background:var(--accent);color:var(--accent-text);padding:14px;border-radius:14px;font-size:15px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:8px 16px 110px;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 4px 8px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;min-height:64px}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;color:var(--accent-text);font-size:16px;padding:0}
.done .chk{background:var(--accent)}
.body{flex:1;min-width:0}
.t{font-size:17px;word-break:break-word}
.done .t{text-decoration:line-through;color:var(--muted)}
.m{font-size:13px;color:var(--muted);margin-top:3px}
.m.over{color:var(--danger);font-weight:600}
.del{background:none;border:0;color:var(--muted);font-size:26px;width:44px;height:44px;flex:none}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:10px 0 8px;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav button span{font-size:20px}
nav button.on{color:var(--accent);font-weight:700}
#fab{position:absolute;right:20px;bottom:76px;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:36px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:5}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateY(110%);transition:transform .25s ease}
#sheet.open{transform:none}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button,.chip{flex:1;padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;font-size:15px}
.seg button.on,.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{padding:10px 6px;font-size:14px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:17px;margin-bottom:10px;min-height:50px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.add{width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);font-size:17px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><p class="om">॥ ॐ नमो भगवते वासुदेवाय ॥</p><h1>My Tasks</h1><p class="sub" id="today"></p></header>
  <div id="banner"></div>
  <div id="list"></div>
  <button id="fab" aria-label="Add new">+</button>
  <nav>
    <button data-f="all" class="on"><span>📋</span>All</button>
    <button data-f="task"><span>✅</span>Tasks</button>
    <button data-f="reminder"><span>⏰</span>Reminders</button>
    <button data-f="done"><span>🏁</span>Done</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet">
  <div class="seg"><button id="bTask" class="on">✅ Task</button><button id="bRem">⏰ Reminder</button></div>
  <input id="title" placeholder="What do you need to do?" maxlength="200" enterkeyhint="done">
  <div class="chips"><button class="chip" id="cToday">Today</button><button class="chip" id="cTom">Tomorrow</button><button class="chip" id="cNone">No date</button></div>
  <div class="row"><input id="date" type="date" aria-label="Date"><input id="time" type="time" aria-label="Time"></div>
  <button class="add" id="addBtn">Add</button>
</div>
<script>
const KEY="my-tasks-v1";
let items=[],type="task",filter="all";
const $=id=>document.getElementById(id);
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
$("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
try{const m={name:"My Tasks",short_name:"Tasks",display:"standalone",start_url:location.href,background_color:"#4f46e5",theme_color:"#4f46e5"};
const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));document.head.append(l)}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function setDay(n){const d=new Date();d.setDate(d.getDate()+n);$("date").value=ymd(d)}
$("cToday").onclick=()=>setDay(0);$("cTom").onclick=()=>setDay(1);$("cNone").onclick=()=>{$("date").value="";$("time").value=""};
function setType(t){type=t;$("bTask").classList.toggle("on",t==="task");$("bRem").classList.toggle("on",t==="reminder");
  if(t==="reminder"){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}}
$("bTask").onclick=()=>setType("task");$("bRem").onclick=()=>setType("reminder");
function openSheet(){$("scrim").style.display="block";$("sheet").classList.add("open");setTimeout(()=>$("title").focus(),250)}
function closeSheet(){$("sheet").classList.remove("open");$("scrim").style.display="none";$("title").blur()}
$("fab").onclick=openSheet;$("scrim").onclick=closeSheet;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});

function due(i){return i.date?new Date(i.date+"T"+(i.time||"23:59")):null}
function label(i){
  if(!i.date)return "No date";
  const d=new Date(i.date+"T00:00"),t=i.time?" · "+i.time:"";
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/864e5);
  const rel=diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  return rel+t;
}
$("addBtn").onclick=()=>{
  const title=$("title").value.trim();
  if(!title){$("title").focus();return}
  items.push({id:Date.now(),title,type,date:$("date").value,time:$("time").value,done:false,fired:false});
  $("title").value="";$("date").value="";$("time").value="";
  save();closeSheet();render();
};
$("title").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});

function render(){
  const now=new Date();
  let v=items.filter(i=>filter==="done"?i.done:!i.done&&(filter==="all"||i.type===filter));
  v.sort((a,b)=>{const x=due(a),y=due(b);if(!x&&!y)return a.id-b.id;if(!x)return 1;if(!y)return -1;return x-y});
  const L=$("list");L.innerHTML="";
  if(!v.length){L.innerHTML='<div class="empty">Nothing here yet 🎉<br>Tap + to add one</div>';return}
  v.forEach(i=>{
    const d=due(i),over=d&&!i.done&&d<now;
    const el=document.createElement("div");el.className="item"+(i.done?" done":"");
    const cb=document.createElement("button");cb.className="chk";cb.textContent=i.done?"✓":"";cb.setAttribute("aria-label","Toggle done");
    cb.onclick=()=>{i.done=!i.done;save();render()};
    const body=document.createElement("div");body.className="body";
    const t=document.createElement("div");t.className="t";t.textContent=(i.type==="reminder"?"⏰ ":"")+i.title;
    const m=document.createElement("div");m.className="m"+(over?" over":"");m.textContent=(over?"Overdue · ":"")+label(i);
    body.append(t,m);
    const del=document.createElement("button");del.className="del";del.textContent="×";del.setAttribute("aria-label","Delete");
    del.onclick=()=>{items=items.filter(x=>x.id!==i.id);save();render()};
    el.append(cb,body,del);L.append(el);
  });
}
function check(){
  const now=new Date();let hit=null;
  items.forEach(i=>{
    if(i.type==="reminder"&&!i.done&&!i.fired&&i.date){
      const d=due(i);
      if(d&&d<=now){i.fired=true;hit=i;
        try{if("Notification" in window&&Notification.permission==="granted")new Notification("Reminder",{body:i.title})}catch(e){}
        try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
    }
  });
  if(hit){save();const b=$("banner");b.textContent="⏰ "+hit.title+" (tap to dismiss)";b.style.display="block";b.onclick=()=>b.style.display="none";render()}
}
setInterval(check,15000);document.addEventListener("visibilitychange",check);check();render();
</script>
</body>
</html>
